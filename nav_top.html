<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>叠层标签页 · 圆角耳朵</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111;
      font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
    }

    .tab {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100vw;
      transition: transform 0.5s ease;
      will-change: transform;
      overflow: visible;
    }

    #tab0 { height: 100vh; background: black;    z-index: 5;  }
    #tab1 { height: 90vh;  background: #31152B;  z-index: 10; }
    #tab2 { height: 90vh;  background: #723147;  z-index: 15; }
    #tab3 { height: 90vh;  background: #CC4452;  z-index: 20; }
    #tab4 { height: 90vh;  background: #E6B098;  z-index: 25; }

    .tab.collapsed {
      transform: translateY(100vh);
    }
    body.hover-bottom .tab.collapsed {
      transform: translateY(90vh);
    }

    /* ===== 耳朵 ===== */
    .ear {
      position: absolute;
      top: -69px;
      width: 20%;
      height: 10%;
      border-radius: 12px 12px 0 0;
      cursor: pointer;
      font-size: 14px;
      user-select: none;
      z-index: 30;
    }

    .ear::before,
    .ear::after {
      position: absolute;
      bottom: 0;
      content: '';
      width: 20px;
      height: 20px;
      border-radius: 100%;
      box-shadow: 0 0 0 40px transparent;
      transition: .2s;
    }
    .ear::before {
      left: -20px;
      clip-path: inset(50% -10px 0 50%);
    }
    .ear::after {
      right: -20px;
      clip-path: inset(50% 50% 0 -10px);
    }

    /* 文字容器（无 hover 提亮） */
    .ear-label {
      position: absolute;
      inset: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }

    /* 各层配色 */
    #tab1 .ear { left: 60%; background: #31152B; color: #fff; }
    #tab1 .ear::before,
    #tab1 .ear::after { box-shadow: 0 0 0 30px #31152B; }

    #tab2 .ear { left: 40%; background: #723147; color: #fff; }
    #tab2 .ear::before,
    #tab2 .ear::after { box-shadow: 0 0 0 30px #723147; }

    #tab3 .ear { left: 20%; background: #CC4452; color: #fff; }
    #tab3 .ear::before,
    #tab3 .ear::after { box-shadow: 0 0 0 30px #CC4452; }

    #tab4 .ear { left: 0%; background: #E6B098; color: #333; }
    #tab4 .ear::before,
    #tab4 .ear::after { box-shadow: 0 0 0 30px #E6B098; }
  </style>
</head>
<body>
  <div id="tab0" class="tab"></div>
  <div id="tab1" class="tab"><div class="ear" data-index="1"><span class="ear-label">标签1</span></div></div>
  <div id="tab2" class="tab"><div class="ear" data-index="2"><span class="ear-label">标签2</span></div></div>
  <div id="tab3" class="tab"><div class="ear" data-index="3"><span class="ear-label">标签3</span></div></div>
  <div id="tab4" class="tab"><div class="ear" data-index="4"><span class="ear-label">标签4</span></div></div>

  <script>
    const tabs = {
      1: document.getElementById('tab1'),
      2: document.getElementById('tab2'),
      3: document.getElementById('tab3'),
      4: document.getElementById('tab4'),
    };

    const open = { 1: true, 2: true, 3: true, 4: true };

    function render() {
      for (let i = 1; i <= 4; i++) {
        tabs[i].classList.toggle('collapsed', !open[i]);
      }
    }

    document.querySelectorAll('.ear').forEach(ear => {
      ear.addEventListener('click', (e) => {
        e.stopPropagation();
        const n = Number(ear.dataset.index);
        for (let i = 1; i <= n; i++) open[i] = true;
        for (let i = n + 1; i <= 4; i++) open[i] = false;
        render();
      });
    });

    render();

    // 底部 10vh 感应
    const ZONE = 0.1;
    window.addEventListener('mousemove', (e) => {
      const inBottom = e.clientY > window.innerHeight * (1 - ZONE);
      document.body.classList.toggle('hover-bottom', inBottom);
    });
  </script>
</body>
</html>
