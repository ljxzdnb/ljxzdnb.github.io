<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>叠层标签页 · 顶部耳朵 · 上下收放</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111;
      font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
    }

    .tab {
      position: absolute;
      left: 0;
      bottom: 0;               /* 底部对齐 */
      width: 100vw;
      box-shadow: 0 -6px 6px rgba(0, 0, 0, 0.3);
      transition: transform 0.5s ease;
      will-change: transform;
      overflow: visible;
    }

    /* 高度递减，顶边错开 */
    #tab0 { height: 100vh; background: black;    z-index: 5;  }
    #tab1 { height: 90vh;  background: #31152B;  z-index: 10; }
    #tab2 { height: 90vh;  background: #723147;  z-index: 15; }
    #tab3 { height: 90vh;  background: #CC4452;  z-index: 20; }
    #tab4 { height: 90vh;  background: #E6B098;  z-index: 25; }

    /* 耳朵：顶部，向上伸出 */
    #tab1::after, #tab2::after, #tab3::after, #tab4::after {
      content: '';
      position: absolute;
      width: 25vw;
      height: 10vh;
      top: -10vh;               /* 伸出顶边之外 */
      border-radius: 8px 8px 0 0;
    }
    #tab1::after { background: #31152B; left: 75%; }
    #tab2::after { background: #723147; left: 50%; }
    #tab3::after { background: #CC4452; left: 25%; }
    #tab4::after { background: #E6B098; left: 0%; }

    /* 点击区，和耳朵重合 */
    .hit {
      position: absolute;
      width: 25vw;
      height: 10vh;
      top: -10vh;
      cursor: pointer;
      z-index: 2;
    }
    #tab1 .hit { left: 75%; }
    #tab2 .hit { left: 50%; }
    #tab3 .hit { left: 25%; }
    #tab4 .hit { left: 0%; }

    /* 收回：向下移出 */
    .tab.collapsed {
      transform: translateY(90vh);
    }
  </style>
</head>
<body>
  <div id="tab0" class="tab"></div>
  <div id="tab1" class="tab"><label class="hit" data-index="1"></label></div>
  <div id="tab2" class="tab"><label class="hit" data-index="2"></label></div>
  <div id="tab3" class="tab"><label class="hit" data-index="3"></label></div>
  <div id="tab4" class="tab"><label class="hit" data-index="4"></label></div>

  <script>
    const tabs = {
      1: document.getElementById('tab1'),
      2: document.getElementById('tab2'),
      3: document.getElementById('tab3'),
      4: document.getElementById('tab4'),
    };

    const open = { 1: true, 2: true, 3: true, 4: true };

    function render() {
      for (let i = 1; i <= 4; i++) {
        tabs[i].classList.toggle('collapsed', !open[i]);
      }
    }

    document.querySelectorAll('.hit').forEach(hit => {
      hit.addEventListener('click', (e) => {
        e.stopPropagation();
        const n = Number(hit.dataset.index);
        for (let i = 1; i <= n; i++) open[i] = true;
        for (let i = n + 1; i <= 4; i++) open[i] = false;
        render();
      });
    });

    render();
  </script>
</body>
</html>
