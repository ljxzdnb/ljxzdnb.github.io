<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>叠层标签页 · 耳朵拉直</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111;
      font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
    }

    .tab {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100vw;
      transition: transform 0.25s ease;
      will-change: transform;
      overflow: visible;
    }

    #tab0 { height: 100vh; background: black;    z-index: 5;  }
    #tab1 { height: 90vh;  background: #31152B;  z-index: 10; }
    #tab2 { height: 90vh;  background: #723147;  z-index: 15; }
    #tab3 { height: 90vh;  background: #CC4452;  z-index: 20; }
    #tab4 { height: 90vh;  background: #E6B098;  z-index: 25; }

    .tab.collapsed {
      transform: translateY(90vh);
      transition-delay: 0.4s;
    }
    .tab:not(.collapsed) {
      transition-delay: 0s;
    }

    /* 耳朵 */
    .ear {
      position: absolute;
      top: -69px;
      width: 20%;
      height: 69px;
      border-radius: 12px 12px 0 0;
      cursor: pointer;
      z-index: 30;
      transform-origin: bottom center;
      transition:
        transform 0.4s ease 0.4s,
        opacity 0.4s ease 0.4s,
        border-radius 0.4s ease 0.4s;
    }
    .ear.melting {
      transform: translateY(50px) scaleY(0.08) scaleX(0.5);
      border-radius: 80px 80px 0 0;
      opacity: 0;
      transition:
        transform 0.4s ease 0s,
        opacity 0.4s ease 0s,
        border-radius 0.4s ease 0s;
    }

    .ear::before,
    .ear::after {
      position: absolute;
      bottom: 0;
      content: '';
      width: 20px;
      height: 20px;
      border-radius: 100%;
      box-shadow: 0 0 0 40px transparent;
    }
    .ear::before { left: -20px; clip-path: inset(50% -10px 0 50%); }
    .ear::after  { right: -20px; clip-path: inset(50% 50% 0 -10px); }

    /* 固定文字容器：和耳朵同位置同尺寸 */
    .label {
      position: fixed;
      top: calc(10vh - 69px);
      height: 69px;
      z-index: 40;
      cursor: pointer;
      user-select: none;
    }

    /* 提亮块：四周离耳朵边框 10px */
    .label-bg {
      position: absolute;
      inset: 10px;                /* 上下左右各留 10px */
      border-radius: 8px;
      background: transparent;
      transition: background .2s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #fff;
      white-space: nowrap;
    }

    .label:hover .label-bg {
      background: rgba(255, 255, 255, 0.1);
    }

    /* 各层配色 + 位置 */
    #tab1 .ear { left: 60%; background: #31152B; }
    #tab1 .ear::before, #tab1 .ear::after { box-shadow: 0 0 0 30px #31152B; }

    #tab2 .ear { left: 40%; background: #723147; }
    #tab2 .ear::before, #tab2 .ear::after { box-shadow: 0 0 0 30px #723147; }

    #tab3 .ear { left: 20%; background: #CC4452; }
    #tab3 .ear::before, #tab3 .ear::after { box-shadow: 0 0 0 30px #CC4452; }

    #tab4 .ear { left: 0%; background: #E6B098; }
    #tab4 .ear::before, #tab4 .ear::after { box-shadow: 0 0 0 30px #E6B098; }

    /* label 和耳朵同位置同宽 */
    .label[data-index="1"] { left: 60%; width: 20%; }
    .label[data-index="2"] { left: 40%; width: 20%; }
    .label[data-index="3"] { left: 20%; width: 20%; }
    .label[data-index="4"] { left: 0%;  width: 20%; }
  </style>
</head>
<body>
  <div id="tab0" class="tab"></div>
  <div id="tab1" class="tab"><div class="ear" data-index="1"></div></div>
  <div id="tab2" class="tab"><div class="ear" data-index="2"></div></div>
  <div id="tab3" class="tab"><div class="ear" data-index="3"></div></div>
  <div id="tab4" class="tab"><div class="ear" data-index="4"></div></div>

  <div class="label" data-index="1"><span class="label-bg">标签1</span></div>
  <div class="label" data-index="2"><span class="label-bg">标签2</span></div>
  <div class="label" data-index="3"><span class="label-bg">标签3</span></div>
  <div class="label" data-index="4"><span class="label-bg">标签4</span></div>

  <script>
    const tabs = {
      1: document.getElementById('tab1'),
      2: document.getElementById('tab2'),
      3: document.getElementById('tab3'),
      4: document.getElementById('tab4'),
    };

    const ears = {};
    document.querySelectorAll('.ear').forEach(e => ears[e.dataset.index] = e);

    const open = { 1: true, 2: true, 3: true, 4: true };

    function render() {
      for (let i = 1; i <= 4; i++) {
        tabs[i].classList.toggle('collapsed', !open[i]);
        ears[i].classList.toggle('melting', !open[i]);
      }
    }

    document.querySelectorAll('.ear').forEach(ear => {
      ear.addEventListener('click', (e) => {
        e.stopPropagation();
        const n = Number(ear.dataset.index);
        for (let i = 1; i <= n; i++) open[i] = true;
        for (let i = n + 1; i <= 4; i++) open[i] = false;
        render();
      });
    });

    document.querySelectorAll('.label').forEach(label => {
      label.addEventListener('click', () => {
        const n = Number(label.dataset.index);
        for (let i = 1; i <= n; i++) open[i] = true;
        for (let i = n + 1; i <= 4; i++) open[i] = false;
        render();
      });
    });

    render();
  </script>
</body>
</html>
