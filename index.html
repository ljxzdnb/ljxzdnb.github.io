<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>ljx's personal website</title>
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css'>
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.2/css/all.css'>
    <link rel="stylesheet" href="style.css">
    <link rel='stylesheet' href='github-markdown.css'>
    <link rel='stylesheet' href='github.css'>
    <link rel="shortcut icon" href="icon.ico" type="image/x-icon"/>
    <link rel="icon" href="icon.png" sizes="32x32" type="image/png"/>
    <style>
        /* ===== 导航栏样式 ===== */
        .navbar-mainbg {
            background: linear-gradient(135deg, #2d3436 0%, #000000 100%);
            padding: 0;
            box-shadow: 0 2px 20px rgba(0,0,0,0.5);
        }
        .navbar-mainbg .navbar-brand {
            color: #fff;
            font-weight: 600;
            padding: 15px 20px;
            font-size: 1.2rem;
            cursor: pointer;
        }
        .navbar-mainbg .navbar-brand:hover {
            color: #dfe6e9;
        }
        .navbar-mainbg .navbar-nav {
            padding: 0;
            position: relative;
        }
        .navbar-mainbg .navbar-nav .nav-item {
            position: relative;
            margin: 0 2px;
        }
        .navbar-mainbg .navbar-nav .nav-link {
            color: rgba(255,255,255,0.7);
            padding: 12px 20px;
            font-size: 0.95rem;
            transition: color 0.3s;
            position: relative;
            z-index: 2;
            cursor: pointer;
        }
        .navbar-mainbg .navbar-nav .nav-link i {
            margin-right: 6px;
        }
        .navbar-mainbg .navbar-nav .nav-link:hover {
            color: #fff;
        }
        /* 滑块 - 使用伪元素实现 */
        .navbar-mainbg .navbar-nav .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 10%;
            width: 80%;
            height: 3px;
            background: #00b894;
            border-radius: 3px 3px 0 0;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0,184,148,0.5);
        }
        @media (max-width: 992px) {
            .navbar-mainbg .navbar-nav .nav-item.active::after {
                left: 0;
                width: 100%;
                height: 3px;
            }
            .navbar-mainbg .navbar-nav .nav-link {
                padding: 10px 15px;
            }
        }

        /* ===== 中英文切换按钮 ===== */
        .navbar-mainbg .lang-switch-wrapper {
            display: flex;
            align-items: center;
            padding: 0 15px;
        }
        .lang-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.25);
            color: #fff;
            border-radius: 30px;
            padding: 5px 14px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(4px);
            white-space: nowrap;
        }
        .lang-btn:hover {
            background: rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.5);
            color: #fff;
            transform: scale(1.03);
        }
        .lang-btn i {
            font-size: 0.85rem;
        }
        @media (max-width: 992px) {
            .navbar-mainbg .lang-switch-wrapper {
                padding: 8px 15px 15px 15px;
                width: 100%;
                justify-content: flex-start;
                border-top: 1px solid rgba(255,255,255,0.08);
            }
        }

        /* ===== 其他样式 ===== */
        .content .left textarea {
            display: none;
        }
        .markdown-body {
            padding: 30px 20px;
            max-width: 900px;
            margin: 0 auto;
            min-height: 400px;
        }
        .headcontent {
            position: sticky;
            top: 0;
            z-index: 999;
        }
        .hori-selector {
            display: none !important;
        }
        .navbar-toggler {
            border: none;
            padding: 10px 15px;
        }
        .navbar-toggler:focus {
            outline: none;
        }
        .loading-tip {
            text-align: center;
            padding: 50px 20px;
            color: #666;
            font-size: 1.1rem;
        }
        .loading-tip i {
            margin-right: 10px;
        }
    </style>
</head>
<body>

<main class="headcontent">
<nav class="navbar navbar-expand-custom navbar-mainbg">
    <a class="navbar-brand" href="#" onclick="toggleFullScreen()">
        <i class="fas fa-code" style="margin-right:8px;"></i><span id="brandTitle">ljx 的个人网站</span>
    </a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <i class="fas fa-bars text-white" style="font-size:1.4rem;"></i>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav ml-auto">
            <li class="nav-item active">
                <a class="nav-link" id="nav-0" href="javascript:void(0);" data-nav="info">
                    <i class="far fa-copy"></i><span data-i18n="nav-info">信息</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" id="nav-1" href="javascript:void(0);" data-nav="call">
                    <i class="far fa-clone"></i><span data-i18n="nav-call">联系</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" id="nav-2" href="javascript:void(0);" data-nav="leetcode">
                    <i class="far fa-bookmark"></i><span data-i18n="nav-leetcode">力扣</span>
                </a>
            </li>
        </ul>
        <!-- 中英文切换按钮 -->
        <div class="lang-switch-wrapper">
            <span class="lang-btn" id="langToggle" onclick="toggleLanguage()">
                <i class="fas fa-globe-asia"></i> <span id="langLabel">English</span>
            </span>
        </div>
    </div>
</nav>
</main>

<div class="content">
    <div class="right">
        <div id="markdown" class="markdown-body">
            <div class="loading-tip">
                <i class="fas fa-spinner fa-spin"></i> 加载中...
            </div>
        </div>
    </div>
</div>

<!-- 依赖 -->
<script src='jquery.min.js'></script>
<script src='latex/MathJax.js?config=TeX-MML-AM_CHTML'></script>
<script src='https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js'></script>
<script src='https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.min.js'></script>
<script src="script.js"></script>
<script src='marked.js'></script>
<script src='highlight.min.js'></script>
<script src="markdown.js"></script>

<script>
    // ---------- 全屏切换 ----------
    function toggleFullScreen() {
        var elem = document.documentElement;
        if (!document.fullscreenElement) {
            elem.requestFullscreen().catch(err => {
                console.error('全屏错误:', err.message);
            });
        } else {
            document.exitFullscreen();
        }
    }

    // ---------- 全局状态 ----------
    let currentLang = 'zh';
    let currentNav = 'info';
    let isLoading = false;

    // ---------- 代码高亮 ----------
    function highlightCode() {
        try {
            // 尝试多种 highlight.js API
            if (typeof hljs !== 'undefined') {
                // 方法1: 使用 highlightAll (新版)
                if (typeof hljs.highlightAll === 'function') {
                    hljs.highlightAll();
                    console.log('✅ 使用 hljs.highlightAll()');
                }
                // 方法2: 使用 highlightBlock (旧版)
                else if (typeof hljs.highlightBlock === 'function') {
                    document.querySelectorAll('#markdown pre code').forEach(function(block) {
                        hljs.highlightBlock(block);
                    });
                    console.log('✅ 使用 hljs.highlightBlock()');
                }
                // 方法3: 使用 highlightElement (某些版本)
                else if (typeof hljs.highlightElement === 'function') {
                    document.querySelectorAll('#markdown pre code').forEach(function(block) {
                        hljs.highlightElement(block);
                    });
                    console.log('✅ 使用 hljs.highlightElement()');
                }
                // 方法4: 手动遍历
                else {
                    document.querySelectorAll('#markdown pre code').forEach(function(block) {
                        var code = block.textContent;
                        var result = hljs.highlightAuto(code);
                        block.innerHTML = result.value;
                        block.className = 'hljs ' + result.language;
                    });
                    console.log('✅ 使用 hljs.highlightAuto()');
                }
            }
        } catch(e) {
            console.warn('代码高亮失败:', e.message);
        }
    }

    // ---------- 渲染 Markdown ----------
    function renderMarkdown(content) {
        var markdownDiv = document.getElementById('markdown');
        if (!markdownDiv) return;
        
        try {
            var html = marked.parse(content);
            markdownDiv.innerHTML = html;
            
            // 代码高亮
            setTimeout(function() {
                highlightCode();
            }, 50);
            
            // 重新渲染 MathJax
            setTimeout(function() {
                if (window.MathJax && MathJax.typesetPromise) {
                    MathJax.typesetPromise().catch(function() {});
                } else if (window.MathJax && MathJax.Hub) {
                    MathJax.Hub.Queue(["Typeset", MathJax.Hub]);
                }
            }, 100);
            
            // 处理 graphviz
            setTimeout(function() {
                var dotelems = document.querySelectorAll('#markdown .language-dot');
                for (var i = 0; i < dotelems.length; i++) {
                    var elem = dotelems[i];
                    if (!elem.classList.contains('d3-processed')) {
                        elem.classList.add('d3-processed');
                        d3ize(elem);
                    }
                }
            }, 200);
            
            console.log('✅ 渲染完成');
        } catch(e) {
            console.error('渲染错误:', e);
            markdownDiv.innerHTML = '<div class="loading-tip">渲染错误: ' + e.message + '</div>';
        }
    }

    // ---------- 加载 Markdown 文件 ----------
    function loadMarkdownFile(nav, lang) {
        isLoading = true;
        console.log('📂 加载: files/' + nav + '_' + lang + '.md');

        var markdownDiv = document.getElementById('markdown');
        if (markdownDiv) {
            markdownDiv.innerHTML = '<div class="loading-tip"><i class="fas fa-spinner fa-spin"></i> 加载中...</div>';
        }

        var filename = 'files/' + nav + '_' + lang + '.md';
        
        fetch(filename, { cache: 'no-store' })
            .then(function(response) {
                if (!response.ok) {
                    throw new Error('HTTP ' + response.status + ': ' + filename);
                }
                return response.text();
            })
            .then(function(content) {
                console.log('✅ 加载成功: ' + filename + ' (长度: ' + content.length + ')');
                isLoading = false;
                renderMarkdown(content);
            })
            .catch(function(error) {
                console.error('❌ 加载失败:', error.message);
                isLoading = false;
                var errorMsg = '# 加载失败\n\n无法加载 `' + filename + '` 文件。\n\n错误信息: ' + error.message;
                renderMarkdown(errorMsg);
            });
    }

    // ---------- 切换导航 ----------
    function switchNav(nav) {
        if (nav === currentNav && !isLoading) {
            console.log('⏭️ 已是当前导航: ' + nav);
            return;
        }
        
        console.log('🔀 切换到: ' + nav);
        currentNav = nav;
        
        document.querySelectorAll('.navbar-nav .nav-item').forEach(function(item) {
            item.classList.remove('active');
        });
        var targetLink = document.querySelector('.navbar-nav .nav-link[data-nav="' + nav + '"]');
        if (targetLink) {
            var parent = targetLink.closest('.nav-item');
            if (parent) {
                parent.classList.add('active');
            }
        }
        
        loadMarkdownFile(nav, currentLang);
    }

    // ---------- 切换语言 ----------
    window.toggleLanguage = function() {
        var newLang = (currentLang === 'zh') ? 'en' : 'zh';
        currentLang = newLang;
        console.log('🌐 切换语言: ' + (currentLang === 'zh' ? '中文' : 'English'));
        
        // 更新品牌标题
        var brandTitle = document.getElementById('brandTitle');
        if (brandTitle) {
            brandTitle.innerText = (currentLang === 'zh') ? 'ljx 的个人网站' : "ljx's personal website";
        }
        
        // 更新切换按钮文字
        var langLabel = document.getElementById('langLabel');
        if (langLabel) {
            langLabel.innerText = (currentLang === 'zh') ? 'English' : '中文';
        }

        // 更新导航文字
        var navMap = {
            'zh': {
                'nav-info': '信息',
                'nav-call': '联系',
                'nav-leetcode': '力扣'
            },
            'en': {
                'nav-info': 'Info',
                'nav-call': 'Call',
                'nav-leetcode': 'LeetCode'
            }
        };
        var navData = navMap[currentLang];
        document.querySelectorAll('[data-i18n]').forEach(function(el) {
            var key = el.getAttribute('data-i18n');
            if (navData[key]) {
                el.innerText = navData[key];
            }
        });

        // 重新加载当前导航对应的文件
        loadMarkdownFile(currentNav, currentLang);
    };

    // ---------- 导航点击事件 ----------
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('.navbar-nav .nav-link').forEach(function(link) {
            link.addEventListener('click', function(e) {
                var nav = this.getAttribute('data-nav');
                if (nav) {
                    switchNav(nav);
                }
            });
        });

        setTimeout(function() {
            console.log('🚀 初始化加载 info_cn.md');
            loadMarkdownFile('info', 'zh');
        }, 200);
    });


    console.log('✅ 中英文切换已配置，从 files/ 文件夹加载');
    console.log('📁 文件格式: files/{nav}_{lang}.md');
</script>

</body>
</html>
